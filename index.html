         same file is served for every path (see vercel.json's SPA rewrite). -->
    <title>Ergon Product Studio — Sites, Sistemas e Automações</title>

      name="description"
      content="A Ergon é um product studio: entendemos problemas de negócio e construímos sites, sistemas internos, plataformas e automações para resolvê-los."
    />
    <link rel="canonical" href="https://www.ergonstudio.com.br/" />

    <meta property="og:site_name" content="Ergon Product Studio" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Ergon Product Studio — Sites, Sistemas e Automações" />

      property="og:description"
      content="A Ergon é um product studio: entendemos problemas de negócio e construímos sites, sistemas internos, plataformas e automações para resolvê-los."

    <meta property="og:image" content="https://www.ergonstudio.com.br/favicon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Ergon Product Studio — Sites, Sistemas e Automações" />

      name="twitter:description"
      content="A Ergon é um product studio: entendemos problemas de negócio e construímos sites, sistemas internos, plataformas e automações para resolvê-los."
    />
